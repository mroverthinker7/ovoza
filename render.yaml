services:
  - type: web
    name: ovoza-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ovoza-db
          property: connectionString

databases:
  - name: ovoza-db
    plan: free
    region: frankfurt
    databaseName: ovoza
    user: ovoza
